name: twinkle-linux
base: core24
version: '0.1.0'
summary: Monitor brightness control for Linux
description: |
  Twinkle Linux provides system tray integration for easy brightness control
  of monitors on Linux. Supports external monitors via DDC/CI (HDMI, DisplayPort,
  USB-C) and internal laptop panels via systemd-logind D-Bus (Intel, AMD, NVIDIA).

grade: stable
confinement: strict

license: MIT

apps:
  twinkle-linux:
    command: bin/twinkle-linux
    common-id: com.github.ebarczynski.TwinkleLinux
    desktop: share/applications/twinkle-linux.desktop
    plugs:
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - unity7
      - hardware-observe
      - raw-usb
      - network
      - dbus
    slots:
      - dbus-daemon

slots:
  dbus-daemon:
    interface: dbus
    bus: session
    name: com.github.ebarczynski.TwinkleLinux

parts:
  twinkle-linux:
    plugin: rust
    source: ../..
    source-subdir: twinkle-rust
    build-packages:
      - libgtk-4-dev
      - pkg-config
    stage-packages:
      - libgtk-4-1
      - ddcutil
    override-build: |
      craftctl default
      mkdir -p $CRAFT_PART_INSTALL/bin
      cp twinkle-rust/target/release/twinkle-linux $CRAFT_PART_INSTALL/bin/

  ddcutil:
    plugin: autotools
    source: https://www.ddcutil.com/tarballs/ddcutil-2.1.4.tar.gz
    build-packages:
      - libusb-1.0-0-dev
      - libi2c-dev
      - libdrm-dev
    stage-packages:
      - libusb-1.0-0
      - libdrm2

  desktop-integration:
    plugin: dump
    source: ../..
    organize:
      packaging/twinkle-linux.desktop: share/applications/twinkle-linux.desktop
    stage:
      - share/applications/twinkle-linux.desktop
