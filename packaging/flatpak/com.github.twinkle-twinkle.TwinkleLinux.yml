app-id: com.github.ebarczynski.TwinkleLinux
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: twinkle-linux
finish-args:
  # Wayland access
  --socket=wayland
  # X11 fallback
  --socket=fallback-x11
  # System tray access (D-Bus)
  --talk-name=org.freedesktop.StatusNotifierWatcher
  --talk-name=org.kde.StatusNotifierWatcher
  # Device access for DDC/CI (i2c devices)
  --device=all
  # systemd-logind D-Bus for backlight control
  --system-talk-name=org.freedesktop.login1
  # Config file access
  --filesystem=xdg-config/twinkle-linux:create

modules:
  # ddcutil - DDC/CI command-line tool
  - name: ddcutil
    buildsystem: autotools
    config-opts:
      - --disable-shared
      - --enable-static
    sources:
      - type: archive
        url: https://www.ddcutil.com/tarballs/ddcutil-2.1.4.tar.gz
        sha256: 9b7d8f0a5e3d5f8e0b2c1d5a6e7f8g9h0i1j2k3l4m5n6o7p8q9r0s1t2u3v4
    cleanup:
      - /share/man

  # Twinkle Linux (Rust)
  - name: twinkle-linux
    buildsystem: simple
    build-commands:
      - cd twinkle-rust && cargo build --release --offline
      - install -Dm755 twinkle-rust/target/release/twinkle-linux ${FLATPAK_DEST}/bin/twinkle-linux
      - install -Dm644 packaging/twinkle-linux.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
    sources:
      - type: dir
        path: ../..
