name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev pkg-config

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            twinkle-rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('twinkle-rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cd twinkle-rust && cargo fmt --all -- --check

      - name: Clippy
        run: cd twinkle-rust && cargo clippy -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev pkg-config

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            twinkle-rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('twinkle-rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run tests
        run: cd twinkle-rust && cargo test --verbose

  build:
    name: Build x86_64
    runs-on: ubuntu-24.04
    needs: [check, test]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev pkg-config

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            twinkle-rust/target
          key: ${{ runner.os }}-cargo-x86_64-unknown-linux-gnu-${{ hashFiles('twinkle-rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-x86_64-unknown-linux-gnu-

      - name: Build release
        run: |
          cd twinkle-rust
          cargo build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: twinkle-linux-x86_64
          path: twinkle-rust/target/release/twinkle-linux
